<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --given: #1f2430;
    --user: #2b5fd9;
    --error: #d62828;
    --error-bg: #fde2e2;
    --line: #c9c4b8;
    --line-strong: #1f2430;
    --sel: #c7d8ff;
    --peer: #e9eef9;
    --same: #d6e2ff;
    --done: #2a9d5c;
    --done-bg: #e3f4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --panel: #1e2128;
      --ink: #e8e9ec;
      --muted: #9aa0ab;
      --given: #e8e9ec;
      --user: #7fa6ff;
      --error: #ff6b6b;
      --error-bg: #4a1f24;
      --line: #3a3e48;
      --line-strong: #c9ccd3;
      --sel: #34466e;
      --peer: #252a35;
      --same: #2d3a58;
      --done: #4cc38a;
      --done-bg: #1d3a2c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--muted); font-size: .9rem; display: flex; gap: 12px; }
  .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    aspect-ratio: 1;
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--line-strong);
    border-radius: 6px;
    overflow: hidden;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.1rem, 6vw, 1.9rem);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background-color .12s;
  }
  .cell:nth-child(9n) { border-right: none; }
  .cell.c2, .cell.c5 { border-right: 2px solid var(--line-strong); }
  .cell.r2, .cell.r5 { border-bottom: 2px solid var(--line-strong); }
  .cell.r8 { border-bottom: none; }
  .cell.given { color: var(--given); font-weight: 600; }
  .cell.user { color: var(--user); }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.selected { background: var(--sel); }
  .cell.conflict { background: var(--error-bg); }
  .cell.error { color: var(--error); font-weight: 700; }
  .cell.complete { color: var(--done); }
  .cell.pop { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .num {
    position: relative;
    aspect-ratio: 0.8;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--user);
    font-size: clamp(1.2rem, 6vw, 1.7rem);
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: inherit;
  }
  .num:active { transform: scale(.95); }
  .num .left {
    font-size: .6rem;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
  }
  .num.done {
    background: var(--done-bg);
    border-color: var(--done);
    color: var(--done);
  }
  .num.done .left { color: var(--done); }

  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: .95rem;
    font-family: inherit;
    cursor: pointer;
  }
  .actions button:active { transform: scale(.97); }

  .toast {
    min-height: 1.4em;
    text-align: center;
    font-size: .95rem;
    color: var(--muted);
  }
  .toast.err { color: var(--error); }
  .toast.ok { color: var(--done); font-weight: 600; }

  .win {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.45);
    padding: 16px;
  }
  .win.show { display: flex; }
  .win .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .win h2 { margin: 0 0 8px; color: var(--done); }
  .win p { margin: 0 0 16px; color: var(--muted); }
  .win button {
    padding: 10px 18px; border-radius: 8px; border: none;
    background: var(--done); color: #fff; font-size: 1rem; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sudoku</h1>
    <div class="meta">
      <span>Fácil</span>
      <span>Erros: <b id="errors">0</b></span>
      <span><b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="board" id="board" aria-label="Tabuleiro de Sudoku"></div>

  <div class="toast" id="toast">Toque numa casa vazia e escolha um número.</div>

  <div class="pad" id="pad"></div>

  <div class="actions">
    <button id="erase">⌫ Apagar</button>
    <button id="restart">↺ Reiniciar</button>
    <button id="newgame">＋ Novo jogo</button>
  </div>
</div>

<div class="win" id="win">
  <div class="card">
    <h2>Parabéns! 🎉</h2>
    <p id="winText">Você completou o puzzle.</p>
    <button id="winNew">Novo jogo</button>
  </div>
</div>

<script>
(() => {
  // ---------- Gerador de puzzles ----------
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const canPlace = (g, i, n) => {
    const r = Math.floor(i / 9), c = i % 9;
    const br = r - r % 3, bc = c - c % 3;
    for (let k = 0; k < 9; k++) {
      if (g[r * 9 + k] === n || g[k * 9 + c] === n) return false;
      if (g[(br + Math.floor(k / 3)) * 9 + bc + k % 3] === n) return false;
    }
    return true;
  };

  function fillGrid(g) {
    const i = g.indexOf(0);
    if (i === -1) return true;
    for (const n of shuffle([1,2,3,4,5,6,7,8,9])) {
      if (canPlace(g, i, n)) {
        g[i] = n;
        if (fillGrid(g)) return true;
        g[i] = 0;
      }
    }
    return false;
  }

  // Conta soluções (para no limite) — garante solução única.
  function countSolutions(g, limit = 2) {
    let best = -1, bestOpts = null;
    for (let i = 0; i < 81; i++) {
      if (g[i]) continue;
      const opts = [];
      for (let n = 1; n <= 9; n++) if (canPlace(g, i, n)) opts.push(n);
      if (opts.length === 0) return 0;
      if (!bestOpts || opts.length < bestOpts.length) { best = i; bestOpts = opts; }
      if (opts.length === 1) break;
    }
    if (best === -1) return 1;
    let count = 0;
    for (const n of bestOpts) {
      g[best] = n;
      count += countSolutions(g, limit - count);
      g[best] = 0;
      if (count >= limit) break;
    }
    return count;
  }

  // Puzzle fácil: 40–44 pistas, removidas em pares simétricos,
  // mantendo solução única.
  function generateEasy() {
    const solution = new Array(81).fill(0);
    fillGrid(solution);
    const puzzle = solution.slice();
    const targetClues = 40 + Math.floor(Math.random() * 5);
    let clues = 81;
    const order = shuffle([...Array(41).keys()]); // 0..40 (metade + centro)
    for (const i of order) {
      if (clues <= targetClues) break;
      const j = 80 - i;
      const a = puzzle[i], b = puzzle[j];
      puzzle[i] = 0; puzzle[j] = 0;
      if (countSolutions(puzzle.slice()) !== 1) {
        puzzle[i] = a; puzzle[j] = b;
      } else {
        clues -= (i === j ? 1 : 2);
      }
    }
    return { puzzle, solution };
  }

  // ---------- Estado ----------
  const boardEl = document.getElementById('board');
  const padEl = document.getElementById('pad');
  const toastEl = document.getElementById('toast');
  const errorsEl = document.getElementById('errors');
  const timerEl = document.getElementById('timer');
  const winEl = document.getElementById('win');

  let puzzle, solution, grid, selected = -1, errors = 0;
  let seconds = 0, timerId = null, finished = false;
  let completeDigits = new Set();
  const cells = [];
  const padBtns = [];

  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9;
    const d = document.createElement('div');
    d.className = `cell r${r} c${c}`;
    d.addEventListener('click', () => select(i));
    boardEl.appendChild(d);
    cells.push(d);
  }
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.className = 'num';
    b.innerHTML = `<span>${n}</span><span class="left"></span>`;
    b.setAttribute('aria-label', `Número ${n}`);
    b.addEventListener('click', () => input(n));
    padEl.appendChild(b);
    padBtns.push(b);
  }

  const peersOf = i => {
    const r = Math.floor(i / 9), c = i % 9;
    const br = r - r % 3, bc = c - c % 3;
    const s = new Set();
    for (let k = 0; k < 9; k++) {
      s.add(r * 9 + k); s.add(k * 9 + c);
      s.add((br + Math.floor(k / 3)) * 9 + bc + k % 3);
    }
    s.delete(i);
    return s;
  };
  const PEERS = Array.from({ length: 81 }, (_, i) => peersOf(i));

  // Casas cujo número repete outro na mesma linha/coluna/bloco.
  function conflicts() {
    const bad = new Set();
    for (let i = 0; i < 81; i++) {
      if (!grid[i]) continue;
      for (const p of PEERS[i]) if (grid[p] === grid[i]) { bad.add(i); bad.add(p); }
    }
    return bad;
  }

  function msg(text, cls = '') {
    toastEl.textContent = text;
    toastEl.className = 'toast ' + cls;
  }

  function render() {
    const bad = conflicts();
    const counts = Array(10).fill(0);
    const validCounts = Array(10).fill(0);
    for (let i = 0; i < 81; i++) {
      if (!grid[i]) continue;
      counts[grid[i]]++;
      if (!bad.has(i)) validCounts[grid[i]]++;
    }
    const nowComplete = new Set();
    for (let n = 1; n <= 9; n++) if (validCounts[n] === 9) nowComplete.add(n);

    const selVal = selected >= 0 ? grid[selected] : 0;
    const peers = selected >= 0 ? PEERS[selected] : new Set();

    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = grid[i];
      el.textContent = v || '';
      const isGiven = puzzle[i] !== 0;
      el.classList.toggle('given', isGiven);
      el.classList.toggle('user', !isGiven && v !== 0);
      el.classList.toggle('selected', i === selected);
      el.classList.toggle('peer', peers.has(i));
      el.classList.toggle('same', selVal !== 0 && v === selVal && i !== selected);
      el.classList.toggle('conflict', bad.has(i));
      el.classList.toggle('error', bad.has(i) && !isGiven);
      el.classList.toggle('complete', v !== 0 && nowComplete.has(v));
    }

    for (let n = 1; n <= 9; n++) {
      const b = padBtns[n - 1];
      const done = nowComplete.has(n);
      b.classList.toggle('done', done);
      const left = Math.max(0, 9 - counts[n]);
      b.querySelector('.left').textContent = done ? '✓' : left;
      b.title = done ? `O número ${n} está completo` : `Faltam ${left}`;
    }

    // Anima e avisa quando um número acaba de ficar completo.
    for (const n of nowComplete) {
      if (!completeDigits.has(n)) {
        for (let i = 0; i < 81; i++) if (grid[i] === n) {
          cells[i].classList.remove('pop'); void cells[i].offsetWidth; cells[i].classList.add('pop');
        }
        if (!finished) msg(`O número ${n} está completo! ✓`, 'ok');
      }
    }
    completeDigits = nowComplete;
    errorsEl.textContent = errors;

    if (!finished && grid.every(v => v) && bad.size === 0) win();
  }

  function select(i) {
    if (finished) return;
    selected = i;
    render();
  }

  function input(n) {
    if (finished) return;
    if (selected < 0) { msg('Primeiro toque numa casa do tabuleiro.'); return; }
    if (puzzle[selected]) { msg('Essa casa faz parte do puzzle e não pode ser alterada.'); return; }
    grid[selected] = grid[selected] === n ? 0 : n;
    if (grid[selected]) {
      const clash = [...PEERS[selected]].some(p => grid[p] === n);
      if (clash) {
        errors++;
        msg(`O ${n} é proibido aqui: já existe na mesma linha, coluna ou bloco.`, 'err');
      } else {
        msg('');
      }
    } else {
      msg('');
    }
    render();
  }

  function erase() {
    if (finished || selected < 0 || puzzle[selected]) return;
    grid[selected] = 0;
    msg('');
    render();
  }

  function tick() {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }

  function startTimer() {
    clearInterval(timerId);
    seconds = -1; tick();
    timerId = setInterval(tick, 1000);
  }

  function win() {
    finished = true;
    clearInterval(timerId);
    selected = -1;
    msg('Puzzle resolvido!', 'ok');
    document.getElementById('winText').textContent =
      `Você completou o puzzle em ${timerEl.textContent}` +
      (errors ? ` com ${errors} ${errors === 1 ? 'erro' : 'erros'}.` : ' sem nenhum erro!');
    setTimeout(() => winEl.classList.add('show'), 500);
  }

  function newGame() {
    ({ puzzle, solution } = generateEasy());
    restart();
  }

  function restart() {
    grid = puzzle.slice();
    selected = -1; errors = 0; finished = false;
    winEl.classList.remove('show');
    completeDigits = new Set();
    // Números que já vêm completos no puzzle não disparam o aviso.
    render();
    msg('Toque numa casa vazia e escolha um número.');
    startTimer();
  }

  document.getElementById('erase').addEventListener('click', erase);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('newgame').addEventListener('click', newGame);
  document.getElementById('winNew').addEventListener('click', newGame);

  // Teclado (opcional, para computador)
  document.addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '9') input(+e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
    else if (selected >= 0 && e.key.startsWith('Arrow')) {
      const r = Math.floor(selected / 9), c = selected % 9;
      const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      select(((r + d[0] + 9) % 9) * 9 + (c + d[1] + 9) % 9);
      e.preventDefault();
    }
  });

  // Exposto para testes
  window.__sudoku = { get puzzle() { return puzzle; }, get solution() { return solution; }, get grid() { return grid; } };

  newGame();
})();
</script>
</body>
</html>
